/* ---------- Programme en cours (réf. pages programme TSE : « À propos » / « Les séances », semaines, progression) ---------- */
function progCard(p) {
  const { sp, week, total, done, next, pct } = progState(p);
  return `<section class="promo prog">${photo(sp.photo)}<div><span class="pk">Mon programme en cours</span><h2>${esc(sp.name)}</h2><p>Semaine ${week} sur ${sp.weeks} · ${done.size}/${total} séances</p>
    <div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avancement du programme"><i style="width:${pct}%"></i></div>
    <div class="row" style="gap:8px">${next ? `<button class="mbtn" data-act="progopen" data-w="${next.w}">Continuer : séance ${next.i + 1}</button>` : `<span class="sl sl-ok">Programme terminé</span>`}<button class="mbtn ghost" data-act="progopen" data-w="" data-t="about">Le programme</button></div></div></section>`;
}
function mProgramme() {
  const p = me();
  if (!can("sport")) return subHead("Mon programme") + mLocked("sport", "Un programme sportif sur plusieurs semaines", `<div class="mcard">${SPORT_TEMPLATES.remise.sessions.map((s, i) => `<div class="prow static"><i class="st st-sport">${I.dumbbell}</i><span class="grow"><small>Séance ${i + 1}</small><b>${esc(s.title)}</b></span></div>`).join("")}</div>`);
  const sp = SPORT_TEMPLATES[p.sport];
  if (!sp) return subHead("Mon programme") + `<div class="mcard"><b>Pas encore de programme</b><p class="small muted">Manon vous en attribue un après votre bilan sport. En attendant, la bibliothèque de vidéos est ouverte.</p><button class="mbtn ghost" data-act="msub" data-s="videos">Voir les vidéos</button></div>`;
  const st = progState(p), wk = Math.min(sp.weeks, S.progWeek || st.week), tab = S.progTab, durs = sp.sessions.map(sessDur);
  const facts = [["chart", sp.level], ["circle", sp.zone], ["cal", `${sp.weeks} semaines`], ["clock", `${sp.sessions.length} séances par semaine`], ["play", `${Math.min(...durs)} à ${Math.max(...durs)} min`], ["dumbbell", progEquip(sp).join(", ") || "Sans matériel"]];
  const hero = `<section class="phero">${photo(sp.photo)}<div><span class="pk">Proposé par Manon · depuis le ${fmtD(st.start, { day: "numeric", month: "long" })}</span><h2>${esc(sp.name)}</h2>
    <div class="pbar" role="progressbar" aria-valuenow="${st.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avancement du programme"><i style="width:${st.pct}%"></i></div><p>Semaine ${st.week} sur ${sp.weeks} · ${st.done.size}/${st.total} séances faites</p></div></section>`;
  const tabs = `<div class="pview wide" role="tablist" aria-label="Programme">${[["about", "À propos"], ["seances", "Les séances"]].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? "on" : ""}" data-act="progtab" data-t="${k}">${l}</button>`).join("")}</div>`;
  const body = tab === "about"
    ? `<div class="mcard"><span class="fk">Bienvenue</span><p style="margin-top:6px">${esc(sp.about)}</p></div>
      <div class="mcard"><span class="fk">En bref</span><ul class="pfacts">${facts.map(([ic, t]) => `<li>${I[ic]}<span>${esc(t)}</span></li>`).join("")}</ul></div>
      <div class="mcard"><span class="fk">Semaine par semaine</span><ol class="pweeksl">${sp.weekNotes.map((n, i) => `<li><b>Semaine ${i + 1}${i + 1 === st.week ? " · en cours" : ""}</b><span>${esc(n)}</span></li>`).join("")}</ol></div>
      <button class="mbtn wide" data-act="progtab" data-t="seances">Voir les séances</button>`
    : `<div class="mchips" role="tablist" aria-label="Semaines">${Array.from({ length: sp.weeks }, (_, k) => { const w = k + 1, n = sp.sessions.filter((_, i) => st.done.has(w + "|" + i)).length; return `<button class="mchip ${w === wk ? "on" : ""}" data-act="progweek" data-w="${w}" role="tab" aria-selected="${w === wk}">Semaine ${w}${n === sp.sessions.length ? I.check : ` · ${n}/${sp.sessions.length}`}</button>`; }).join("")}</div>
      <p class="small muted" style="margin:0 0 12px">${esc(sp.weekNotes[wk - 1])}</p>
      ${sp.sessions.map((s, i) => { const k = wk + "|" + i, ok = st.done.has(k), cur = st.next && st.next.w === wk && st.next.i === i;
        return `<article class="mcard psess ${ok ? "done" : ""} ${cur ? "cur" : ""}"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div><span class="fk">Séance ${i + 1} · conseillée le ${s.day.toLowerCase()}</span><h3 class="mh3">${esc(s.title)}</h3><span class="vmeta">${I.clock}${sessDur(s)} min</span></div>${ok ? `<em class="sl sl-ok">Faite</em>` : cur ? `<em class="sl sl-wait">À faire</em>` : ""}</div>
          <div class="mlist">${s.videos.map(id => vItem(video(id))).join("")}</div>
          <button class="mbtn ${ok ? "ghost" : ""}" data-act="progdone" data-k="${k}">${ok ? `${I.check}Faite · annuler` : "J'ai fait cette séance"}</button></article>`; }).join("")}`;
  return `${subHead("Mon programme")}${hero}${tabs}${body}
    ${note("Repris des programmes TSE (semaines, séances numérotées, progression). Différence : c'est Manon qui attribue le programme depuis la fiche patiente, pas d'inscription libre.")}`;
}

/* ---------- Sélection pour vous : questionnaire (réf. formulaire de recommandation TSE) ---------- */
function quizModal() {
  const q = S.quiz, it = QUIZ[q.step], val = q.a[it.k], last = q.step === QUIZ.length - 1, ok = it.multi ? (val || []).length > 0 : !!val;

/* ---------- Évolution ---------- */
function chartSVG(entries, key, unit, dark = true) {
  const pts = entries.filter(e => e[key] != null);
  if (pts.length < 2) return `<p class="small muted">Ajoutez au moins deux mesures pour voir la courbe.</p>`;
  const vals = pts.map(e => e[key]), scale = unit === "/10";
  const lo = scale ? 0 : Math.floor(Math.min(...vals) - 1), hi = scale ? 10 : Math.ceil(Math.max(...vals) + 1);
  const W = 320, H = 170, L = 34, B = 26, T = 12, x = i => L + i / (pts.length - 1) * (W - L - 12), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = pts.map((e, i) => `${x(i).toFixed(1)},${y(e[key]).toFixed(1)}`).join(" ");
  const c = dark ? { l: "#B2E388", t: "#B4C7BA", g: "rgba(246,249,243,.1)" } : { l: "#18694B", t: "#5C6B63", g: "rgba(15,58,42,.1)" };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(METRICS.find(m => m[0] === key)[1])} : de ${vals[0]} à ${vals[vals.length - 1]} ${unit}">
    ${[lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="${c.g}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="${c.t}" font-size="10">${+v.toFixed(1)}</text>`).join("")}
    <polygon points="${x(0)},${H - B} ${line} ${x(pts.length - 1)},${H - B}" fill="${c.l}" opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="${c.l}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((e, i) => `<circle cx="${x(i)}" cy="${y(e[key])}" r="4.5" fill="${c.l}"/><text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}" fill="${c.t}" font-size="10">${fmtD(e.date, { day: "numeric", month: "numeric" })}</text>`).join("")}</svg>`;
}

  if (b) { const r = b.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; b.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 10}deg) translateY(-8px)`; tilted = b; }
});

let lastSeed = 0;
document.addEventListener("pointermove", e => {
  if (REDUCE || e.pointerType !== "mouse" || S.view !== "site" || $("#modal-root").innerHTML) return;
  const now = performance.now(); if (now - lastSeed < 45) return; lastSeed = now;
  const d = document.createElement("span"), cols = ["#B2E388", "#0F3A2A", "#18694B", "#18694B"], k = Math.floor(now / 45) % cols.length;
  d.className = "seed";
  d.style.cssText = `left:${e.clientX - 5}px;top:${e.clientY - 8}px;background:${cols[k]};--sx:${(k - 1.5) * 10}px;--sy:${18 + k * 4}px;--sr:${k * 70 - 90}deg`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 950);
});

if (EMBED) { const { plan, ...st } = EMBED; Object.assign(S, st); if (plan) me().plan = plan; }
render();
</script>
