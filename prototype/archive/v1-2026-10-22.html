<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateforme Manon Garrione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : un fond vert calme ; les contenus sont des fiches (recette, séance, programme) posées dessus. Bandeau prototype sombre en haut. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface-2:#E9EFE8; --ink:#15221D; --ink-2:#4B5C55; --line:#D5DED7;
  --pine:#1D5848; --pine-ink:#FFFFFF; --pine-soft:#DCEAE4;
  --saffron:#D99A26; --saffron-soft:#FAEDD2; --plum:#7B3F5E; --plum-soft:#F1E2EA; --sky-soft:#DDE9F2;
  --ok:#2F7A4E; --ok-soft:#DDEFE3; --warn:#A8701A; --warn-soft:#F7EBD3; --crit:#A93A3A; --crit-soft:#F6DFDF;
  --bar:#101A16; --bar-ink:#E7EFEA; --bar-2:#24332D;
  --note-bg:#FFF6C9; --note-ink:#5A4A06; --note-line:#D9C25A;
  --shadow:0 1px 2px rgba(16,32,26,.06), 0 8px 24px rgba(16,32,26,.06);
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#15201C; --surface-2:#1B2823; --ink:#E5EEE9; --ink-2:#A2B3AB; --line:#2A3A33;
  --pine:#62B59D; --pine-ink:#0B1411; --pine-soft:#1D3530;
  --saffron:#EDB64F; --saffron-soft:#3A2E15; --plum:#D493B4; --plum-soft:#3A2330; --sky-soft:#1D2D38;
  --ok:#6BC28F; --ok-soft:#18311F; --warn:#E3AE57; --warn-soft:#3A2D14; --crit:#E88787; --crit-soft:#3B1D1D;
  --bar:#060B09; --bar-ink:#E7EFEA; --bar-2:#1C2924;
  --note-bg:#3A3410; --note-ink:#F3E59B; --note-line:#7C6E25;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#15201C; --surface-2:#1B2823; --ink:#E5EEE9; --ink-2:#A2B3AB; --line:#2A3A33;
  --pine:#62B59D; --pine-ink:#0B1411; --pine-soft:#1D3530;
  --saffron:#EDB64F; --saffron-soft:#3A2E15; --plum:#D493B4; --plum-soft:#3A2330; --sky-soft:#1D2D38;
  --ok:#6BC28F; --ok-soft:#18311F; --warn:#E3AE57; --warn-soft:#3A2D14; --crit:#E88787; --crit-soft:#3B1D1D;
  --bar:#060B09; --bar-ink:#E7EFEA; --bar-2:#1C2924;
  --note-bg:#3A3410; --note-ink:#F3E59B; --note-line:#7C6E25;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:800}
h2{font-size:clamp(1.45rem,3vw,2rem);font-weight:650}
h3{font-size:1.15rem;font-weight:650}
h4{font-size:1rem;font-weight:650}
p{margin:0}
a{color:var(--pine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--saffron);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.tint{background:var(--pine-soft);border-color:transparent}
.card.sun{background:var(--saffron-soft);border-color:transparent}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1.5px solid transparent;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;background:none;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--pine);color:var(--pine-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-sun{background:var(--saffron);color:#1E1606}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{border-color:var(--pine)}
.btn-text{padding:6px 8px;color:var(--pine)}
.btn-sm{padding:7px 13px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--plum);border-color:var(--plum)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.suivi{background:var(--surface-2);color:var(--ink-2)}
.pill.f1{background:var(--sky-soft);color:var(--ink)}
.pill.f2{background:var(--saffron-soft);color:var(--ink)}
.pill.f3{background:var(--pine);color:var(--pine-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.plum{background:var(--plum-soft);color:var(--plum)}

/* Prototype bar */
.protobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--bar-ink)}
.protobar .wrap{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding-block:9px}
.protobar .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--saffron)}
.seg{display:inline-flex;background:var(--bar-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--bar-ink);padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--bar-ink);color:var(--bar)}
.protobar select{background:var(--bar-2);color:var(--bar-ink);border:0;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.protobar label{font-size:13px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.protobar .spacer{flex:1}

/* Notes de prototype */
.note{display:flex;gap:8px;align-items:flex-start;background:var(--note-bg);color:var(--note-ink);border:1px dashed var(--note-line);border-radius:8px;padding:7px 11px;font-size:12.5px;line-height:1.45}
.note::before{content:"Note CDC";font-weight:700;letter-spacing:.04em;flex:none}
body.no-notes .note{display:none}

/* ---------- SITE PUBLIC ---------- */
.site-head{background:var(--bg);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--font-display);font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12.5px;color:var(--ink-2)}
.site-nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;justify-content:center}
.site-nav button{background:none;border:0;padding:8px 11px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.site-nav button.on,.site-nav button:hover{color:var(--ink);background:var(--surface-2)}
.hero{padding-block:clamp(36px,7vw,80px)}
.hero .wrap{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:center}
.hero h1 em{font-style:normal;color:var(--pine)}
.hero p.lead{font-size:1.15rem;color:var(--ink-2);max-width:34em;margin-top:18px}
.hero .row{margin-top:26px}
.hero-board{position:relative;display:grid;gap:14px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.ticket .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.ticket h4{margin-top:4px;font-size:1.08rem}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.macro{font-size:12.5px;padding:3px 9px;border-radius:7px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.macro b{font-weight:700}
.ticket.t2{margin-left:clamp(0px,6vw,56px);transform:rotate(-1.2deg)}
.ticket.t3{margin-right:clamp(0px,4vw,40px);transform:rotate(.8deg)}
.section{padding-block:clamp(36px,6vw,64px)}
.section.alt{background:var(--surface-2)}
.section-head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;max-width:40em}
.benefit h3{margin-bottom:6px}
.benefit .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pine-soft);color:var(--pine);margin-bottom:12px}
.benefit .ico svg{width:22px;height:22px}
.steps{counter-reset:s;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.step{position:relative;padding-top:44px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;background:var(--saffron);color:#1E1606;display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.plan-card{display:flex;flex-direction:column;gap:12px;position:relative}
.plan-card.best{border:2px solid var(--pine)}
.plan-card .price{font-family:var(--font-display);font-size:2rem;font-weight:800}
.plan-card .price small{font-family:var(--font-body);font-size:.9rem;font-weight:500;color:var(--ink-2)}
.plan-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.plan-card li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.plan-card li svg{width:17px;height:17px;flex:none;margin-top:3px;color:var(--pine)}
.plan-card .badge{position:absolute;top:-12px;right:16px}
.insta{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.insta a{aspect-ratio:1;border-radius:12px;display:flex;align-items:flex-end;padding:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;position:relative;overflow:hidden}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.yes{color:var(--pine)} .no{color:var(--ink-2);opacity:.6}
.place{display:flex;flex-direction:column;gap:8px}
.place .days{font-weight:700;color:var(--pine)}
.portrait{aspect-ratio:4/5;border-radius:var(--r);background:linear-gradient(160deg,var(--pine-soft),var(--saffron-soft));display:grid;place-items:center;font-family:var(--font-display);font-size:4rem;font-weight:800;color:var(--pine);max-width:100%}
.prose{max-width:65ch;display:flex;flex-direction:column;gap:14px}
.placeholder{background:var(--surface-2);border-radius:6px;padding:0 5px;color:var(--ink-2);font-style:italic}
.site-foot{border-top:1px solid var(--line);padding-block:28px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13.5px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:500;background:var(--surface-2);padding:5px 10px;border-radius:999px;cursor:pointer}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.form-grid .full{grid-column:1/-1}

/* ---------- ESPACE PATIENTE / BACK-OFFICE ---------- */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:24px 60px}
.side{position:sticky;top:72px;align-self:start;display:flex;flex-direction:column;gap:4px}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 6px 16px}
.side .who .pill{white-space:normal;line-height:1.3}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pine);color:var(--pine-ink);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--font-display)}
.side button.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:600;text-align:left}
.side button.nav svg{width:19px;height:19px;flex:none}
.side button.nav:hover{background:var(--surface-2);color:var(--ink)}
.side button.nav.on{background:var(--pine);color:var(--pine-ink)}
.side button.nav .lk{margin-left:auto;opacity:.7}
.side button.nav .lk svg{width:15px;height:15px}
.main{min-width:0;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:clamp(1.6rem,3.4vw,2.2rem)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;margin-inline:-4px}
  .side .who{display:none}
  .side button.nav{width:auto;white-space:nowrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi .v{font-family:var(--font-display);font-size:2.1rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13.5px;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--pine);border-radius:99px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;min-width:0}
.rcard .ph{aspect-ratio:4/3;position:relative;display:flex;align-items:flex-end;padding:12px;cursor:pointer;border:0;width:100%;text-align:left}
.rcard .ph .mealtag{background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.rcard .body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard .body h4{cursor:pointer}
.rcard .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.rcard .meta span{display:inline-flex;gap:4px;align-items:center}
.rcard .meta svg{width:14px;height:14px}
.rcard .fav{position:absolute;top:10px;right:10px}
.tile-petit{background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.55) 0 18%,transparent 19%),linear-gradient(140deg,var(--saffron-soft),var(--saffron))}
.tile-dej{background:radial-gradient(circle at 75% 30%,rgba(255,255,255,.45) 0 22%,transparent 23%),linear-gradient(140deg,var(--pine-soft),var(--pine))}
.tile-diner{background:radial-gradient(circle at 30% 70%,rgba(255,255,255,.35) 0 20%,transparent 21%),linear-gradient(140deg,var(--plum-soft),var(--plum))}
.tile-coll{background:radial-gradient(circle at 70% 70%,rgba(255,255,255,.5) 0 16%,transparent 17%),linear-gradient(140deg,var(--sky-soft),var(--saffron-soft))}
.locked-zone{position:relative}
.locked-zone .blurred{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.upsell{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--saffron);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.locked-zone .upsell{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:min(92%,460px);z-index:2}
.upsell .ico{width:40px;height:40px;border-radius:12px;background:var(--saffron-soft);color:var(--warn);display:grid;place-items:center}
.upsell .ico svg{width:20px;height:20px}
.vcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.vcard .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1B2B25,#2E4A40);display:grid;place-items:center;position:relative;cursor:pointer;border:0;width:100%;color:#fff}
.vcard .thumb .play{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);color:#1B2B25;display:grid;place-items:center}
.vcard .thumb .play svg{width:22px;height:22px;margin-left:3px}
.vcard .thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.vcard .thumb .theme{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);color:#1B2B25;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.vcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.week{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.day.today{border:2px solid var(--pine)}
.day h4{display:flex;justify-content:space-between;align-items:center}
.slot{display:flex;flex-direction:column;gap:2px}
.slot .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.slot button.rlink{background:none;border:0;padding:0;text-align:left;color:var(--pine);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.session{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.datebox b{display:block;font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--pine)}
.datebox span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.seats{display:flex;gap:3px;margin-top:6px}
.seats i{width:12px;height:12px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.seats i.f{background:var(--pine);border-color:var(--pine)}
.workout{display:flex;flex-direction:column;gap:10px}
.workout .wv{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;background:var(--surface-2)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:transparent}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:16px;height:16px}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
.toggle{position:relative;width:44px;height:26px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line);cursor:pointer;transition:background .15s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked+span{background:var(--pine)}
.toggle input:checked+span::after{transform:translateX(18px)}
.wa{background:#25D366;color:#06301A}

/* Modal + toast */
.overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--bg);border-radius:18px;width:min(100%,760px);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(100%,980px)}
.modal-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);z-index:2}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:18px}
.modal-foot{position:sticky;bottom:0;background:var(--bg);display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.ingr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ingr li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ingr li b{min-width:72px;font-variant-numeric:tabular-nums}
.stepsol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.stepper{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.stepper button{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-weight:700}
.stepper b{min-width:72px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.nutri-table{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.nutri-table div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.nutri-table b{display:block;font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.nutri-table span{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
@media (max-width:520px){.nutri-table{grid-template-columns:repeat(3,minmax(0,1fr))}}
.player{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#13201B,#2E4A40);color:#E7EFEA;display:grid;place-items:center;text-align:center;padding:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:90;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tmpl-grid{display:grid;grid-template-columns:110px repeat(4,minmax(150px,1fr));gap:6px;align-items:center;min-width:760px}
.tmpl-grid select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const actives = () => PATIENTS.filter(p => p.status === "active");
function statusPill(p) {
  if (p.status === "suspendue") return `<span class="pill warn">Suspendue</span>`;
  if (p.status === "archivée") return `<span class="pill">Archivée</span>`;
  if (p.end && daysUntil(p.end) <= 15 && daysUntil(p.end) >= 0) return `<span class="pill crit">Expire dans ${daysUntil(p.end)} j</span>`;
  return `<span class="pill ok">Active</span>`;
}
function adDashboard() {

  const expiring = act.filter(p => p.end && daysUntil(p.end) >= 0 && daysUntil(p.end) <= 15);
  const noProg = act.filter(p => ACCESS.nutri[p.plan] && !p.nutri);

      <div class="card kpi"><div class="v" style="color:${expiring.length ? "var(--crit)" : "inherit"}">${expiring.length}</div><div class="l">Abonnements qui expirent sous 15 jours</div></div>
      <div class="card kpi"><div class="v">${next ? next.inscrits.length + "/" + next.places : "—"}</div><div class="l">Inscrites à la prochaine séance collective</div></div>
    </div>

      <div class="card stack"><h3>Patientes actives par formule</h3><div class="bars">${byPlan.map(([k, n]) => `<div class="bar"><span>${PLANS[k].code} · ${{ suivi: "Suivi simple", f1: "Nutrition", f2: "+ Recettes", f3: "+ Sport" }[k]}</span><div class="track"><div class="fill" style="width:${n / max * 100}%"></div></div><b class="num">${n}</b></div>`).join("")}</div></div>

        ${noProg.map(p => `<div class="it"><span class="pill warn">Programme</span><div class="grow">${esc(fullName(p))} n'a pas de programme nutritionnel</div><button class="btn btn-text btn-sm" data-act="openpatient" data-id="${p.id}">Attribuer</button></div>`).join("")}
        ${scheduled.map(r => `<div class="it"><span class="pill f1">Programmée</span><div class="grow">Recette « ${esc(r.title)} » publiée le ${fmtD(r.date)}</div></div>`).join("")}
        ${next ? `<div class="it"><span class="pill f3">Séance</span><div class="grow">${esc(next.title)} · ${fmtDay(next.date)} · ${next.inscrits.length}/${next.places}</div><button class="btn btn-text btn-sm" data-act="inscrits" data-id="${next.id}">Inscrites</button></div>` : ""}

/* =========================================================

function openModal(html, wide = false) {
  $("#modal-root").innerHTML = `<div class="overlay" data-act="overlay"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $("#modal-root input, #modal-root select, #modal-root button");
  if (first) first.focus();
}
function closeModal() { $("#modal-root").innerHTML = ""; S.modal = null; }
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
}
function render(scrollTop = false) {
  $("#app").innerHTML = protobar() + (S.view === "site" ? site() : S.view === "patient" ? patient() : admin());
  document.body.classList.toggle("no-notes", !S.notes);
  if (scrollTop) window.scrollTo({ top: 0 });
}
function rerenderRecipeModal() { if (S.modal && S.modal.type === "recipe") openModal(recipeModal(S.modal.id, S.modal.portions), true); }

function parseIngr(line) {
  const m = line.trim().match(/^([\d.,]+)\s*(g|kg|ml|cl|l|c\. à soupe|c\. à café|pincée|tranche)?\s+(.+)$/i);
  if (!m) return [null, "", line.trim()];
  return [parseFloat(m[1].replace(",", ".")), m[2] || "", m[3]];
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "overlay") { if (e.target === t) closeModal(); return; }
  const fn = A[t.dataset.act];
  if (fn) { if (t.tagName === "A") return; e.preventDefault(); fn(t, e); }
});
document.addEventListener("change", e => { const t = e.target.closest("[data-change]"); if (t && CHANGE[t.dataset.change]) CHANGE[t.dataset.change](t); });
document.addEventListener("input", e => { const t = e.target.closest("[data-input]"); if (t && INPUT[t.dataset.input]) INPUT[t.dataset.input](t); });
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if (f && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal(); });

render();
</script>
</body>
</html>
